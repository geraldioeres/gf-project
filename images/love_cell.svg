<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="blueSuit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#56CCF2"/>
      <stop offset="100%" stop-color="#2F80ED"/>
    </linearGradient>
    <linearGradient id="pinkHeart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF758C"/>
      <stop offset="100%" stop-color="#FF7EB3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Floating background heart aura -->
  <path d="M 100, 35 C 80, 10 30, 20 30, 65 C 30, 110 100, 150 100, 150 C 100, 150 170, 110 170, 65 C 170, 20 120, 10 100, 35 Z" fill="#FFE5EC" opacity="0.6"/>

  <!-- Body in Blue Tights -->
  <g filter="url(#shadow)">
    <!-- Legs -->
    <rect x="75" y="150" width="18" height="40" rx="9" fill="url(#blueSuit)"/>
    <rect x="107" y="150" width="18" height="40" rx="9" fill="url(#blueSuit)"/>
    <!-- Cute Shoes -->
    <ellipse cx="80" cy="192" rx="14" ry="7" fill="#FF477E"/>
    <ellipse cx="120" cy="192" rx="14" ry="7" fill="#FF477E"/>
    
    <!-- Torso -->
    <rect x="68" y="105" width="64" height="55" rx="20" fill="url(#blueSuit)"/>
    
    <!-- Arms holding heart -->
    <path d="M 68 120 Q 45 135 70 145" fill="none" stroke="url(#blueSuit)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 132 120 Q 155 135 130 145" fill="none" stroke="url(#blueSuit)" stroke-width="14" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="100" cy="82" r="42" fill="#FFE0BD"/>

    <!-- Love Cell Bonnet/Hat (Heart Shape Hood) -->
    <path d="M 100 35 C 65 35 55 60 58 88 C 65 110 100 125 100 125 C 100 125 135 110 142 88 C 145 60 135 35 100 35 Z" fill="url(#pinkHeart)"/>
    <!-- Face opening cut out -->
    <ellipse cx="100" cy="85" rx="30" ry="28" fill="#FFE0BD"/>

    <!-- Heart Antenna / Top knot -->
    <path d="M 100, 35 Q 100 15 100 12" stroke="#FF477E" stroke-width="4" fill="none"/>
    <path d="M 100 10 C 93 0 80 5 80 16 C 80 25 100 32 100 32 C 100 32 120 25 120 16 C 120 5 107 0 100 10 Z" fill="#FF477E"/>

    <!-- Eyes (Big sparkly webtoon eyes) -->
    <ellipse cx="88" cy="82" rx="6" ry="8" fill="#2B2D42"/>
    <ellipse cx="112" cy="82" rx="6" ry="8" fill="#2B2D42"/>
    <circle cx="86" cy="80" r="2.5" fill="#FFFFFF"/>
    <circle cx="110" cy="80" r="2.5" fill="#FFFFFF"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="80" cy="89" rx="6" ry="4" fill="#FF8EAC" opacity="0.8"/>
    <ellipse cx="120" cy="89" rx="6" ry="4" fill="#FF8EAC" opacity="0.8"/>

    <!-- Happy Mouth -->
    <path d="M 94 90 Q 100 97 106 90" fill="none" stroke="#2B2D42" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Big Center Heart Held in Hands -->
    <path d="M 100 125 C 90 110 68 118 75 136 C 82 152 100 162 100 162 C 100 162 118 152 125 136 C 132 118 110 110 100 125 Z" fill="#FF0054" filter="url(#shadow)"/>
    <!-- Heart Shine -->
    <path d="M 82 124 C 80 128 82 135 85 138" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>
</svg>
