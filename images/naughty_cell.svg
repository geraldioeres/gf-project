<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="blueSuit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#56CCF2"/>
      <stop offset="100%" stop-color="#2F80ED"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Devil Tail -->
    <path d="M 130 140 Q 170 140 165 170 Q 160 190 175 195" fill="none" stroke="#FF0054" stroke-width="4"/>
    <polygon points="175,190 185,195 178,202" fill="#FF0054"/>

    <!-- Body -->
    <rect x="75" y="150" width="18" height="40" rx="9" fill="url(#blueSuit)"/>
    <rect x="107" y="150" width="18" height="40" rx="9" fill="url(#blueSuit)"/>
    <ellipse cx="80" cy="192" rx="14" ry="7" fill="#FF0054"/>
    <ellipse cx="120" cy="192" rx="14" ry="7" fill="#FF0054"/>

    <rect x="68" y="105" width="64" height="55" rx="20" fill="url(#blueSuit)"/>

    <!-- Head -->
    <circle cx="100" cy="80" r="40" fill="#FFE0BD"/>

    <!-- Cute Little Devil Horns -->
    <path d="M 72 48 C 65 32 50 35 55 25 C 70 30 78 45 78 45 Z" fill="#FF0054"/>
    <path d="M 128 48 C 135 32 150 35 145 25 C 130 30 122 45 122 45 Z" fill="#FF0054"/>

    <!-- Mischievous Eyes (One Wink) -->
    <!-- Left Winking eye -->
    <path d="M 78 80 Q 86 72 94 80" fill="none" stroke="#2B2D42" stroke-width="4" stroke-linecap="round"/>
    <!-- Right Open Eye -->
    <ellipse cx="114" cy="78" rx="7" ry="9" fill="#2B2D42"/>
    <circle cx="112" cy="74" r="3" fill="#FFFFFF"/>

    <!-- Rosy Cheek -->
    <ellipse cx="80" cy="88" rx="6" ry="4" fill="#FF8EAC" opacity="0.8"/>
    <ellipse cx="120" cy="88" rx="6" ry="4" fill="#FF8EAC" opacity="0.8"/>

    <!-- Naughty Tongue Out Smile -->
    <path d="M 90 92 Q 100 102 110 92 Z" fill="#2B2D42"/>
    <path d="M 97 97 Q 100 106 105 97 Z" fill="#FF477E"/>

    <!-- Cupid's Arrow in Hand -->
    <line x1="45" y1="145" x2="90" y2="115" stroke="#FFD166" stroke-width="4"/>
    <polygon points="40,148 48,140 50,150" fill="#FF0054"/>
    <polygon points="90,115 85,110 82,120" fill="#FF0054"/>
  </g>
</svg>
