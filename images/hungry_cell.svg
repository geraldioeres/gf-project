<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="blueSuit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#56CCF2"/>
      <stop offset="100%" stop-color="#2F80ED"/>
    </linearGradient>
    <linearGradient id="yellowHat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#FFB703"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Body -->
    <rect x="75" y="150" width="18" height="40" rx="9" fill="url(#blueSuit)"/>
    <rect x="107" y="150" width="18" height="40" rx="9" fill="url(#blueSuit)"/>
    <ellipse cx="80" cy="192" rx="14" ry="7" fill="#2F80ED"/>
    <ellipse cx="120" cy="192" rx="14" ry="7" fill="#2F80ED"/>

    <rect x="65" y="105" width="70" height="58" rx="24" fill="url(#blueSuit)"/>

    <!-- Giant Birthday Cake on Head / Chef Hat -->
    <path d="M 60 55 L 140 55 L 135 85 L 65 85 Z" fill="#FFF0F5" stroke="#FF758C" stroke-width="3"/>
    <!-- Cake Icing Drips -->
    <path d="M 60 55 Q 70 65 80 55 Q 90 65 100 55 Q 110 65 120 55 Q 130 65 140 55" fill="none" stroke="#FF477E" stroke-width="5"/>
    <!-- Birthday Candle -->
    <rect x="96" y="25" width="8" height="30" fill="#FFD166"/>
    <path d="M 100 15 C 95 20 100 25 100 25 C 100 25 105 20 100 15 Z" fill="#FF5722"/>

    <!-- Head -->
    <circle cx="100" cy="95" r="38" fill="#FFE0BD"/>

    <!-- Eyes (Hungry / Excited Stars) -->
    <circle cx="85" cy="92" r="7" fill="#2B2D42"/>
    <circle cx="115" cy="92" r="7" fill="#2B2D42"/>
    <polygon points="85,87 87,91 91,92 87,93 85,97 83,93 79,92 83,91" fill="#FFD166"/>
    <polygon points="115,87 117,91 121,92 117,93 115,97 113,93 109,92 113,91" fill="#FFD166"/>

    <!-- Mouth Wide Open Drooling -->
    <path d="M 85 102 Q 100 125 115 102 Z" fill="#D90429"/>
    <!-- Tongue -->
    <path d="M 90 112 Q 100 110 110 112 Q 100 124 90 112 Z" fill="#FF758C"/>
    <!-- Droop Drop -->
    <path d="M 115 110 C 115 118 120 120 120 115 C 120 110 115 110 115 110 Z" fill="#4EA8DE"/>

    <!-- Giant Spoon in Hand -->
    <path d="M 140 100 L 155 160" stroke="#C0C0C0" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="140" cy="95" rx="14" ry="18" fill="#E0E0E0" stroke="#A0A0A0" stroke-width="2"/>
  </g>
</svg>
