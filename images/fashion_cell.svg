<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="blueSuit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#56CCF2"/>
      <stop offset="100%" stop-color="#2F80ED"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEE440"/>
      <stop offset="100%" stop-color="#F15BB5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Body -->
    <rect x="75" y="150" width="18" height="40" rx="9" fill="url(#blueSuit)"/>
    <rect x="107" y="150" width="18" height="40" rx="9" fill="url(#blueSuit)"/>
    <ellipse cx="80" cy="192" rx="14" ry="7" fill="#F15BB5"/>
    <ellipse cx="120" cy="192" rx="14" ry="7" fill="#F15BB5"/>

    <rect x="68" y="105" width="64" height="55" rx="20" fill="url(#blueSuit)"/>

    <!-- Fashion Feather Boa / Scarf -->
    <path d="M 55 100 C 70 125 130 125 145 100 C 130 115 70 115 55 100 Z" fill="#F15BB5"/>

    <!-- Head -->
    <circle cx="100" cy="80" r="40" fill="#FFE0BD"/>

    <!-- Chic Cat-Eye Sunglasses -->
    <polygon points="62,68 95,78 95,90 65,85" fill="#2B2D42"/>
    <polygon points="138,68 105,78 105,90 135,85" fill="#2B2D42"/>
    <line x1="95" y1="78" x2="105" y2="78" stroke="#2B2D42" stroke-width="3"/>
    <!-- Sunglasses Glint -->
    <line x1="68" y1="72" x2="88" y2="82" stroke="#FEE440" stroke-width="2"/>
    <line x1="112" y1="82" x2="132" y2="72" stroke="#FEE440" stroke-width="2"/>

    <!-- Trendy Beret / Hat -->
    <path d="M 50 65 C 50 35 130 30 145 60 C 120 50 70 55 50 65 Z" fill="url(#goldGrad)"/>
    <circle cx="145" cy="55" r="5" fill="#00BBF9"/>

    <!-- Pouty Kiss Lips -->
    <ellipse cx="100" cy="95" rx="5" ry="4" fill="#FF0054"/>

    <!-- Shopping Bags in Hands -->
    <rect x="35" y="125" width="25" height="30" rx="3" fill="#00F5D4"/>
    <path d="M 42 125 C 42 118 53 118 53 125" fill="none" stroke="#2B2D42" stroke-width="2"/>

    <rect x="140" y="120" width="25" height="32" rx="3" fill="#FEE440"/>
    <path d="M 147 120 C 147 113 158 113 158 120" fill="none" stroke="#2B2D42" stroke-width="2"/>
  </g>
</svg>
