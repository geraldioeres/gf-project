<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="blueSuit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#56CCF2"/>
      <stop offset="100%" stop-color="#2F80ED"/>
    </linearGradient>
    <linearGradient id="nightPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7209B7"/>
      <stop offset="100%" stop-color="#3F37C9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Crescent Moon Aura -->
    <path d="M 130 20 A 45 45 0 1 0 170 85 A 35 35 0 1 1 130 20 Z" fill="#FFD166" opacity="0.8"/>

    <!-- Body -->
    <rect x="75" y="150" width="18" height="40" rx="9" fill="url(#blueSuit)"/>
    <rect x="107" y="150" width="18" height="40" rx="9" fill="url(#blueSuit)"/>
    <ellipse cx="80" cy="192" rx="14" ry="7" fill="#3F37C9"/>
    <ellipse cx="120" cy="192" rx="14" ry="7" fill="#3F37C9"/>

    <rect x="68" y="105" width="64" height="55" rx="20" fill="url(#blueSuit)"/>

    <!-- Emotional Cell Purple Scarf / Night Cap -->
    <path d="M 60 100 Q 100 120 140 100 L 135 115 Q 100 135 65 115 Z" fill="url(#nightPurple)"/>

    <!-- Head -->
    <circle cx="100" cy="80" r="40" fill="#FFE0BD"/>

    <!-- Nightcap Hood -->
    <path d="M 60 80 C 60 40 140 40 140 80 Q 155 30 180 50 C 185 80 140 70 140 80 Z" fill="url(#nightPurple)"/>
    <circle cx="180" cy="50" r="8" fill="#FFD166"/>

    <!-- Emotional Teary Sparkly Eyes -->
    <ellipse cx="86" cy="78" rx="7" ry="9" fill="#2B2D42"/>
    <ellipse cx="114" cy="78" rx="7" ry="9" fill="#2B2D42"/>
    <circle cx="84" cy="74" r="3" fill="#FFFFFF"/>
    <circle cx="112" cy="74" r="3" fill="#FFFFFF"/>
    <circle cx="88" cy="82" r="1.5" fill="#FFFFFF"/>
    <circle cx="116" cy="82" r="1.5" fill="#FFFFFF"/>

    <!-- Tear Drop of Emotion -->
    <path d="M 122 84 C 122 90 126 94 126 88 C 126 84 122 84 122 84 Z" fill="#4EA8DE"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="78" cy="86" rx="7" ry="5" fill="#FF8EAC" opacity="0.8"/>
    <ellipse cx="122" cy="86" rx="7" ry="5" fill="#FF8EAC" opacity="0.8"/>

    <!-- Emotional Soft Smile -->
    <path d="M 94 92 Q 100 97 106 92" fill="none" stroke="#2B2D42" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Acoustic Guitar in hand -->
    <g transform="translate(25, 110) rotate(-25)">
      <ellipse cx="40" cy="30" rx="14" ry="18" fill="#D4A373"/>
      <ellipse cx="40" cy="30" rx="5" ry="5" fill="#2B2D42"/>
      <rect x="37" y="-5" width="6" height="25" fill="#CCD5AE"/>
    </g>
  </g>
</svg>
