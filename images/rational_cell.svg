<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="blueSuit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#56CCF2"/>
      <stop offset="100%" stop-color="#2F80ED"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Body -->
    <rect x="75" y="150" width="18" height="40" rx="9" fill="url(#blueSuit)"/>
    <rect x="107" y="150" width="18" height="40" rx="9" fill="url(#blueSuit)"/>
    <ellipse cx="80" cy="192" rx="14" ry="7" fill="#2B2D42"/>
    <ellipse cx="120" cy="192" rx="14" ry="7" fill="#2B2D42"/>

    <rect x="68" y="105" width="64" height="55" rx="20" fill="url(#blueSuit)"/>
    <!-- Collar & Tie -->
    <polygon points="90,105 100,120 110,105" fill="#FFFFFF"/>
    <polygon points="97,112 103,112 105,135 100,140 95,135" fill="#D90429"/>

    <!-- Head -->
    <circle cx="100" cy="80" r="40" fill="#FFE0BD"/>

    <!-- Rational Cell Smart Glasses -->
    <rect x="68" y="70" width="28" height="20" rx="6" fill="none" stroke="#2B2D42" stroke-width="4"/>
    <rect x="104" y="70" width="28" height="20" rx="6" fill="none" stroke="#2B2D42" stroke-width="4"/>
    <line x1="96" y1="78" x2="104" y2="78" stroke="#2B2D42" stroke-width="4"/>
    <!-- Glasses shine -->
    <line x1="72" y1="73" x2="82" y2="85" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>
    <line x1="108" y1="73" x2="118" y2="85" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>

    <!-- Smart Smirk -->
    <path d="M 94 95 Q 105 95 110 90" fill="none" stroke="#2B2D42" stroke-width="3" stroke-linecap="round"/>

    <!-- Clipboard in Hand -->
    <rect x="130" y="110" width="30" height="42" rx="4" fill="#8D99AE"/>
    <rect x="133" y="114" width="24" height="34" rx="2" fill="#FFFFFF"/>
    <line x1="137" y1="122" x2="152" y2="122" stroke="#4EA8DE" stroke-width="2"/>
    <line x1="137" y1="128" x2="150" y2="128" stroke="#2B2D42" stroke-width="2"/>
    <line x1="137" y1="134" x2="148" y2="134" stroke="#2B2D42" stroke-width="2"/>
    <circle cx="140" cy="112" r="3" fill="#2B2D42"/>
  </g>
</svg>
